ask:
  fields:
    text:
      required: true
      example: "What is on my calendar today?"
      selector:
        text:
          multiline: true
    session_id:
      example: "morning-briefing"
      selector:
        text:
    agent_id:
      example: conversation.hermes_assist
      selector:
        entity:
          integration: hermes_assist
          domain: conversation
    system_prompt:
      example: "You summarize sensor data in one sentence."
      selector:
        text:
          multiline: true
    camera_entity_id:
      example: camera.front_door
      selector:
        entity:
          domain: camera
