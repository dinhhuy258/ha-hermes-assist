[project]
name = "ha-hermes-assist"
version = "0.1.0"
description = "Home Assistant conversation agent backed by a Hermes Agent API server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.2"

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["custom_components"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=custom_components.hermes_assist --cov-report=term-missing"
